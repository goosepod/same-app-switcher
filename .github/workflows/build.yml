name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: msys2/setup-msys2@v2.33.0
        with:
          install: mingw-w64-x86_64-gcc
      - name: Set up Windows tools
        run: |
          'C:\msys64\mingw64\bin' >> $env:GITHUB_PATH
          rustup target add x86_64-pc-windows-gnu
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet tool install --global wix --version 4.0.6
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check and build
        run: |
          cargo check --locked --target x86_64-pc-windows-gnu
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --release --target x86_64-pc-windows-gnu
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package EXE, ZIP, and MSI
        id: package
        run: ./scripts/package.ps1
      - name: Verify MSI install and uninstall
        run: ./scripts/test-installer.ps1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: SameAppSwitcher-${{ steps.package.outputs.version }}-windows-x64
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.msi
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "SameAppSwitcher $RELEASE_TAG"
