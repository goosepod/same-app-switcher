name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_ROLL_FORWARD: Major
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Windows tools
        run: |
          dotnet tool install --global wix --version 4.0.6
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check, build, and package EXE, ZIP, and MSI
        id: package
        run: ./build.ps1 -Package
      - name: Verify MSI upgrade and startup cleanup
        run: ./scripts/test-installer.ps1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: SameAppSwitcher-${{ steps.package.outputs.version }}-windows-x64
          path: |
            dist/SameAppSwitcher-*.exe
            dist/*.zip
            dist/*.msi
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "SameAppSwitcher $RELEASE_TAG"
